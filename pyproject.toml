[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repprobe"
version = "0.1.0"
description = "RepProbe: a diagnostic benchmark for repetition counting in video-language models"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
